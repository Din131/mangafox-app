$('.login-fb').click(function(){
    FB.login(function(response){
        if (response.authResponse) {
            FB.api('/me?fields=id,email', function(response) {
                console.log(response);
                var email = '';
                if(response.email) {
                    email = response.email;
                }
                $.post('/connect/email', {fbid:response.id, email:email}, function(data){
                	var r = eval('(' + data + ')');
                	console.log(r);
                    if(r.code == 0) {
                        alert(r.msg);
                    } else if(r.code == 1) {
                        if(r.from_app == 1){
                        	window.location.href='mangazoneappData://www.mangazoneapp.com/return?uid='+r.uid+'&site=mf';
                        	setTimeout(function(){
                        		window.location.href='/';
                        	},2000)
                        }else if(r.from_app == 2){
                        	window.location.href='http://m.mangafox.la/goApp?uid='+r.uid;   	
                        }else{
                        	window.location.href='/';
                        }  
                    } else if(r.code == 2) {
                        window.location.href='/connect/facebook';
                    }
                })
                return false;
            });
        } else {
            console.log('User cancelled login or did not fully authorize.');
        }
    }, {scope:'email'});
})
