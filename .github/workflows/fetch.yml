name: debug-fetch
on: { push: { branches: [debug-fetch] } }
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          mkdir -p out
          for u in https://m.fanfox.net/roll_manga/ao_ashi/c283/ https://m.fanfox.net/roll_manga/ao_ashi/v25/c281/ https://m.fanfox.net/roll_manga/ao_ashi/v25/c281/1.html; do
            echo "### $u" >> out/log.txt
            curl -sS -A "$UA" -D - -o /dev/null -L --max-redirs 5 "$u" | grep -i "^HTTP\|^location" >> out/log.txt
          done
          curl -sSL -A "$UA" https://m.fanfox.net/roll_manga/ao_ashi/c283/ -o out/c283.html
          curl -sSL -A "$UA" https://m.fanfox.net/roll_manga/ao_ashi/v25/c281/ -o out/c281.html
          git config user.name Din131; git config user.email Din131@users.noreply.github.com
          git add out; git commit -m "hasil"; git push
