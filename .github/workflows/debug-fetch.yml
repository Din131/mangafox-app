name: Ambil contoh halaman (debug sekali pakai)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil halaman pencarian dengan User-Agent Android
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36"
          curl -sSL -A "$UA" -o search.html "https://m.fanfox.net/search?k=aoashi"
          curl -sSL -A "$UA" -o home.html "https://m.fanfox.net/"
          ls -la
      - name: Simpan ke branch sementara
        run: |
          cd out
          git init -q -b debug-fetch
          git config user.name "Din131"
          git config user.email "Din131@users.noreply.github.com"
          git add -A && git commit -q -m "debug"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-fetch
