name: Ambil contoh halaman (debug sekali pakai)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil halaman baca beserta skripnya
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36"
          curl -sSL -A "$UA" -o roll.html "https://m.fanfox.net/roll_manga/ao_ashi/v25/c282/1.html"
          grep -oE '(src|href)="[^"]+\.(js|css)[^"]*"' roll.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > assets.txt
          i=0
          while read -r u; do
            case "$u" in //*) u="https:$u";; /*) u="https://m.fanfox.net$u";; esac
            i=$((i+1)); curl -sSL -A "$UA" -o "asset_$i.$( [[ $u == *.css* ]] && echo css || echo js)" "$u" && echo "$i $u" >> assets_map.txt
          done < assets.txt
          ls -la
      - name: Simpan ke branch sementara
        run: |
          cd out
          git init -q -b debug-fetch
          git config user.name "Din131"
          git config user.email "Din131@users.noreply.github.com"
          git add -A && git commit -q -m "debug"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-fetch
