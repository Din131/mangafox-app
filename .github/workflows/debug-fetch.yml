name: Ambil contoh halaman (debug sekali pakai)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil halaman
        run: |
          mkdir out && cd out
          D="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
          M="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36"
          get() { curl -sSL -A "$1" -o "$2" -w "$2 %{http_code} %{url_effective}\n" "$3" >> log.txt; }
          Q="title=&stype=1&name=&type=0&author_method=cw&author=&artist_method=cw&artist=&rating_method=gt&rating=4&released_method=eq&released=&st=2&genres=1%2C5&nogenres=12"
          get "$D" s_default.html "https://fanfox.net/search?$Q&sort="
          for v in rating az latest news 1 2 3 4 5; do get "$D" "s_sort_$v.html" "https://fanfox.net/search?$Q&sort=$v"; done
          get "$D" s_page2.html "https://fanfox.net/search?page=2&$Q&sort="
          get "$M" newm_ranking.html "https://newm.fanfox.net/ranking/"
          grep -oE 'src="[^"]+\.js[^"]*"' newm_ranking.html | sed -E 's/^src="//; s/"$//' | sort -u > rjs.txt
          i=0; while read -r u; do case "$u" in //*) u="https:$u";; /*) u="https://newm.fanfox.net$u";; esac; i=$((i+1)); get "$M" "rank_js_$i.js" "$u"; done < rjs.txt
          cat log.txt
      - name: Simpan ke branch sementara
        run: |
          cd out
          git init -q -b debug-fetch
          git config user.name "Din131"
          git config user.email "Din131@users.noreply.github.com"
          git add -A && git commit -q -m "debug"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-fetch
